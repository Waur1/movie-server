name: Сборка Docker-образа

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код из репозитория
        uses: actions/checkout@v4

      - name: Войти на Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Собрать образ и выложить на склад
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: waurone/movie-server:latest
